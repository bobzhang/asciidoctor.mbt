<?xml version="1.0" encoding="UTF-8"?>
<!-- basic shapes, stroke styles and transforms -->
<svg xmlns="http://www.w3.org/2000/svg" width="400px" height="240px" viewBox="0 0 400 240">
  <style type="text/css"><![CDATA[
    .thick { stroke-width: 6; stroke: #2a6; }
    g.row > circle { fill: #36c }
    #star { fill: gold; stroke: #a60 }
    rect + ellipse { fill: #c3c }
  ]]></style>
  <rect x="5" y="5" width="390" height="230" fill="none" stroke="#999" stroke-dasharray="6 3"/>
  <g class="row" transform="translate(10 10)">
    <circle cx="40" cy="40" r="30"/>
    <circle cx="110" cy="40" r="30" fill-opacity="0.5" stroke="black" stroke-width="3"/>
    <rect x="160" y="10" width="60" height="60" rx="10" ry="10" fill="#e84"/>
    <ellipse cx="270" cy="40" rx="40" ry="20"/>
    <line x1="320" y1="10" x2="370" y2="70" class="thick" stroke-linecap="round"/>
  </g>
  <g transform="translate(10 100) scale(1.2)">
    <polyline points="0,40 20,0 40,40 60,0 80,40" fill="none" stroke="#c33" stroke-width="4" stroke-linejoin="round"/>
    <polygon id="star" points="130,0 142,30 175,30 148,48 158,80 130,60 102,80 112,48 85,30 118,30"/>
    <polygon points="200,0 260,0 230,60" fill="#39c" fill-rule="evenodd" stroke="#036" stroke-width="2" stroke-linejoin="bevel"/>
  </g>
  <g transform="matrix(1 0 0.3 1 250 150)">
    <rect width="60" height="40" fill="#8a4"/>
  </g>
  <g transform="skewY(10) translate(0 160)" opacity="0.6">
    <path d="M 20 20 h 50 v 30 h -50 z m 10 5 h 30 v 20 h -30 z" fill="#446" fill-rule="evenodd"/>
    <path d="M100,50 Q130,0 160,50 T220,50" fill="none" stroke="#a24" stroke-width="3"/>
    <path d="M230 50 A 20 30 0 1 1 280 50" fill="none" stroke="#248" stroke-width="3"/>
  </g>
</svg>

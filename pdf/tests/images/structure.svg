<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="60%" stop-color="#f90"/>
      <stop offset="100%" stop-color="#930"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: #06c"/>
      <stop offset="1" style="stop-color: #cef"/>
    </linearGradient>
    <clipPath id="round">
      <circle cx="60" cy="60" r="45"/>
    </clipPath>
    <symbol id="badge" viewBox="0 0 20 20">
      <rect width="20" height="20" rx="4" fill="#c33"/>
      <path d="M5 10 L9 14 L15 6" fill="none" stroke="#fff" stroke-width="2"/>
    </symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <g id="dot"><circle r="6" fill="#093"/></g>
  </defs>
  <rect x="10" y="10" width="100" height="100" fill="url(#fade)" clip-path="url(#round)"/>
  <circle cx="180" cy="60" r="45" fill="url(#glow)"/>
  <use xlink:href="#badge" x="240" y="20" width="40" height="40"/>
  <use xlink:href="#dot" x="250" y="90"/>
  <use href="#dot" x="275" y="90"/>
  <line x1="20" y1="150" x2="120" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <polyline points="150,180 190,130 230,180 270,130" fill="none" stroke="#333" stroke-width="2" marker-mid="url(#arrow)"/>
  <svg x="200" y="150" width="60" height="40" viewBox="0 0 30 20">
    <rect width="40" height="10" fill="#96c"/>
  </svg>
</svg>

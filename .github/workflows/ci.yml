name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      # golden replay maps harvested paths onto the pinned upstream checkout
      - name: Checkout upstream Asciidoctor
        uses: actions/checkout@v4
        with:
          repository: asciidoctor/asciidoctor
          ref: 30fb8cd5f7145c57274b04524ceaa99812f830e0
          path: .repos/asciidoctor

      - name: Fetch dependencies
        run: moon update

      - name: Format and interface check
        run: |
          moon fmt
          moon info
          moon -C pdf fmt
          moon -C pdf info
          moon -C prawn fmt
          moon -C prawn info
          git diff --exit-code

      # type-check all targets, unit tests on wasm-gc/native/js, golden parity
      - name: Check
        run: moon run --target native scripts/check.mbtx

      # the PDF backend is a separate module (pdf/), laid out by the prawn/
      # module on moonbitlang/pagelayout
      - name: PDF backend
        run: |
          moon -C pdf check --target all --deny-warn
          moon -C pdf test --target native
          moon -C prawn check --target all --deny-warn
          moon -C prawn test --target native

      # the asciidoctor-pdf command, native and wasm (as moonx runs it), with
      # its bundled fonts: sample documents must convert to valid PDFs
      # (checked by the script, and by poppler's pdfinfo where installed)
      - name: Install poppler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: PDF smoke test
        run: |
          moon -C pdf build --target native --release
          moon -C pdf build --target wasm --release
          moon run --target native scripts/pdf_smoke.mbtx

      # The comparison with Ruby asciidoctor-pdf (scripts/pdf_compare.mbtx
      # --gate, --self-test, --spec-goldens) needs Ruby, the asciidoctor-pdf
      # gems and poppler; it is run locally (see README.mbt.md, Development).

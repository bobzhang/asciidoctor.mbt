name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      # golden replay maps harvested paths onto the pinned upstream checkout
      - name: Checkout upstream Asciidoctor
        uses: actions/checkout@v4
        with:
          repository: asciidoctor/asciidoctor
          ref: 30fb8cd5f7145c57274b04524ceaa99812f830e0
          path: .repos/asciidoctor

      - name: Fetch dependencies
        run: moon update

      - name: Format and interface check
        run: |
          moon fmt
          moon info
          git diff --exit-code

      # type-check all targets, unit tests on wasm-gc/native/js, golden parity
      - name: Check
        run: moon run --target native scripts/check.mbtx

      # the PDF backend is a separate module (pdf/), built on moonbitlang/pagelayout
      - name: PDF backend
        run: |
          moon -C pdf check --target all
          moon -C pdf test --target native
